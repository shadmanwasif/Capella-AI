    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #1e293b;
            --header-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --sidebar-bg: #ffffff;
            --msg-capella: #ffffff;
            --input-bg: #e2e8f0;
            --code-bg: #1e293b;
        }
        body.dark-mode {
            --bg-color: #0d0f12;
            --text-color: #f0f3f8;
            --header-bg: rgba(18, 20, 26, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --sidebar-bg: #12141a;
            --msg-capella: #181b22;
            --input-bg: #161820;
            --code-bg: #0d0e12;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); z-index: 10; flex-shrink: 0; }
        .header-left, .header-right { display: flex; align-items: center; gap: 10px; }
        .brand-box { display: flex; align-items: center; gap: 8px; }
        .app-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
        .app-title { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .model-selector { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; cursor: pointer; font-weight: 500; }

        .icon-btn { background: none; border: none; color: inherit; font-size: 1.2rem; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .icon-btn:hover { background-color: rgba(128, 128, 128, 0.15); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); z-index: 999; display: none; }
        .overlay.active { display: block; }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); z-index: 1000; transition: left 0.3s ease; display: flex; flex-direction: column; }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .sidebar-content { flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .new-chat-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }

        .menu-list { display: flex; flex-direction: column; gap: 8px; }
        .menu-item-btn { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--input-bg); border-radius: 8px; font-size: 0.9rem; border: 1px solid var(--border-color); color: var(--text-color); cursor: pointer; width: 100%; text-align: left; transition: all 0.2s; }
        .menu-item-btn:hover { background: rgba(99, 102, 241, 0.15); border-color: #6366f1; }
        .menu-item-btn.active-tab { border-color: #6366f1; background: rgba(99, 102, 241, 0.25); font-weight: 600; }
        
        .badge-active { font-size: 0.75rem; background: #10b981; color: white; padding: 2px 6px; border-radius: 4px; }
        .badge-pending { font-size: 0.72rem; background: #64748b; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; }

        .settings-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 90%; max-width: 400px; background-color: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 16px; z-index: 2000; padding: 20px; display: none; opacity: 0; transition: all 0.3s ease; }
        .settings-panel.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.95rem; }
        .setting-item select, .setting-item input[type="checkbox"] { padding: 6px; border-radius: 6px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); }

        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 88%; position: relative; }
        .user-wrapper { align-self: flex-end; }
        .capella-wrapper { align-self: flex-start; }

        .message-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .sender-icon { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
        .sender-name { font-size: 0.78rem; color: #94a3b8; font-weight: 500; }

        .message-box-outer { position: relative; display: inline-block; }
        .message { padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.92rem; word-wrap: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; position: relative; }
        .user-msg { background: linear-gradient(135deg, #312e81, #1e1b4b); color: #f1f5f9; border-bottom-right-radius: 4px; border: 1px solid rgba(99,102,241,0.3); }
        .capella-msg { background-color: var(--msg-capella); color: var(--text-color); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }

        .copy-tooltip { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 10; border: 1px solid rgba(255,255,255,0.1); }
        .copy-tooltip.show { opacity: 1; }

        .msg-image { max-width: 100%; max-height: 320px; border-radius: 12px; display: block; border: 1px solid rgba(255,255,255,0.1); margin-top: 8px; }
        .download-img-btn { margin-top: 10px; background: rgba(99,102,241,0.9); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

        /* Code Runner Styling */
        .code-runner-container { background: var(--code-bg); border: 1px solid var(--border-color); border-radius: 8px; margin: 10px 0; overflow: hidden; }
        .code-runner-header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.1); padding: 6px 12px; font-size: 12px; color: #94a3b8; }
        .code-actions button { background: #1f293d; color: #e2e8f0; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 6px; }
        .code-actions .btn-run { background: #10b981; color: white; font-weight: bold; border: none; }
        .code-actions .btn-run:hover { background: #059669; }
        pre { margin: 0; padding: 12px; overflow-x: auto; background: var(--code-bg); }
        code { font-family: monospace; font-size: 13px; color: #38bdf8; }
        .code-output-frame { width: 100%; height: 110px; border: none; border-top: 1px solid var(--border-color); background: #050608; }

        .input-container { padding: 10px 12px; background: var(--header-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .preview-wrapper { display: none; position: relative; align-self: flex-start; }
        .preview-wrapper.active { display: block; }
        .img-preview { height: 55px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .remove-img-btn { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }

        .input-box { display: flex; align-items: center; gap: 8px; background-color: var(--input-bg); border-radius: 20px; padding: 6px 12px; border: 1px solid var(--border-color); }
        .input-box textarea { flex: 1; background: none; border: none; color: var(--text-color); resize: none; max-height: 120px; outline: none; font-size: 0.92rem; padding: 4px 0; }
        .send-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; padding: 8px 14px; border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 0.82rem; flex-shrink: 0; transition: background 0.2s; }
        .send-btn.stop-mode { background: #ef4444; }

        .thinking-indicator { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
        .blue-dot-pulse { width: 8px; height: 8px; background-color: #818cf8; border-radius: 50%; animation: dotPulse 1.2s infinite ease-in-out; }
        @keyframes dotPulse { 0%, 100% { transform: scale(0.8); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 1; } }
    </style>
</head>

    <script>
        let chatHistory = [];
        let isGenerating = false;
        let abortController = null;
        let currentMode = 'chat'; // 'chat', 'image', 'video', 'audio'

        // 10 Language Greetings Map
        const greetingsMap = {
            "English": "Hi, I am Capella AI created by Shadman Wasif Faruque! How can I help you today? 😊",
            "Bengali": "হ্যালো! আমি শাদমান ওয়াসিফ ফারুক দ্বারা তৈরি ক্যাফেলা এআই। আজ আপনাকে কীভাবে সাহায্য করতে পারি? 😊",
            "Spanish": "¡Hola! Soy Capella AI, creada por Shadman Wasif Faruque. ¿Cómo puedo ayudarte hoy? 😊",
            "Hindi": "नमस्ते! मैं शादमान वासिफ फारूक द्वारा बनाया गया Capella AI हूँ। आज मैं आपकी क्या मदद कर सकता हूँ? 😊",
            "Arabic": "مرحباً! أنا Capella AI تم إنشائي بواسطة شادمان واصف فاروق. كيف يمكنني مساعدتك اليوم؟ 😊",
            "French": "Bonjour! Je suis Capella AI, créé par Shadman Wasif Faruque. Comment puis-je vous aider aujourd'hui? 😊",
            "German": "Hallo! Ich bin Capella AI, entwickelt von Shadman Wasif Faruque. Wie kann ich Ihnen heute helfen? 😊",
            "Chinese": "你好！我是由 Shadman Wasif Faruque 创建的 Capella AI。今天我能为您提供什么帮助？😊",
            "Japanese": "こんにちは！Shadman Wasif Faruqueによって作成されたCapella AIです。今日はどのようなお手伝いができますか？😊",
            "Urdu": "سلام! میں شادمان واصف فاروق کا بنایا ہوا Capella AI ہوں۔ آج میں آپ کی کیا مدد کر سکتا ہوں؟ 😊"
        };

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelector = document.getElementById('modelSelector');
        const searchToggle = document.getElementById('searchToggle');
        const langSelect = document.getElementById('langSelect');
        const themeSelect = document.getElementById('themeSelect');
        const appTitle = document.getElementById('appTitle');

        // Light mode default on, dark mode off
        document.body.classList.remove('dark-mode');
        themeSelect.value = 'light';

        themeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        });

        langSelect.addEventListener('change', () => {
            if (chatHistory.length === 0 && currentMode === 'chat') {
                resetChatUI();
            }
        });

        function getGreeting() {
            const lang = langSelect.value;
            return greetingsMap[lang] || greetingsMap["English"];
        }

        function resetChatUI() {
            chatHistory = [];
            chatContainer.innerHTML = '';
            if (currentMode === 'chat') {
                appendMessage('capella', getGreeting());
            } else if (currentMode === 'image') {
                appendMessage('capella', '🎨 **Image Generator Mode Active!**\nEnter a prompt below to generate an image.');
            } else if (currentMode === 'video') {
                appendMessage('capella', '🎥 **Video Generator Mode:** Coming soon!');
            } else if (currentMode === 'audio') {
                appendMessage('capella', '🎙️ **Audio Talk Mode:** Coming soon!');
            }
        }

        // Sidebar Mode Switcher Buttons
        document.querySelectorAll('.menu-item-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.menu-item-btn').forEach(b => b.classList.remove('active-tab'));
                const targetBtn = e.currentTarget;
                targetBtn.classList.add('active-tab');
                currentMode = targetBtn.getAttribute('data-mode');

                if (currentMode === 'chat') appTitle.innerText = 'Capella Chat';
                else if (currentMode === 'image') appTitle.innerText = 'Capella Image Gen';
                else if (currentMode === 'video') appTitle.innerText = 'Capella Video (Soon)';
                else if (currentMode === 'audio') appTitle.innerText = 'Capella Audio (Soon)';

                resetChatUI();
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('overlay').classList.remove('active');
            });
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        });
        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        });
        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('active');
        });
        document.getElementById('closeBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        });
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('settingsPanel').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        });

        document.getElementById('newChatBtn').addEventListener('click', () => {
            resetChatUI();
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        });

        function renderMessageContent(content) {
            let parsedHtml = typeof marked !== 'undefined' ? marked.parse(content) : content.replace(/\n/g, '<br>');

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = parsedHtml;

            const codeBlocks = tempDiv.querySelectorAll('pre code');
            codeBlocks.forEach((codeBlock) => {
                const pre = codeBlock.parentElement;
                const language = (codeBlock.className.match(/language-(\w+)/) || [])[1] || 'javascript';

                const runnerContainer = document.createElement('div');
                runnerContainer.className = 'code-runner-container';

                const header = document.createElement('div');
                header.className = 'code-runner-header';
                header.innerHTML = `
                    <span class="code-lang">${language.toUpperCase()}</span>
                    <div class="code-actions">
                        <button class="btn-copy" onclick="copyCode(this)">Copy</button>
                        ${(language === 'javascript' || language === 'html' || language === 'js') ? 
                          `<button class="btn-run" onclick="runCode(this)">▶ Run</button>` : ''}
                    </div>
                `;

                const outputFrame = document.createElement('iframe');
                outputFrame.className = 'code-output-frame';
                outputFrame.style.display = 'none';

                pre.parentNode.insertBefore(runnerContainer, pre);
                runnerContainer.appendChild(header);
                runnerContainer.appendChild(pre);
                runnerContainer.appendChild(outputFrame);
            });

            return tempDiv.innerHTML;
        }

        function copyCode(button) {
            const container = button.closest('.code-runner-container');
            const code = container.querySelector('code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                button.innerText = 'Copied!';
                setTimeout(() => button.innerText = 'Copy', 2000);
            });
        }

        function runCode(button) {
            const container = button.closest('.code-runner-container');
            const code = container.querySelector('code').innerText;
            const outputFrame = container.querySelector('.code-output-frame');

            outputFrame.style.display = 'block';
            const doc = outputFrame.contentDocument || outputFrame.contentWindow.document;

            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { font-family: monospace; padding: 10px; background: #050608; color: #10b981; margin: 0; font-size: 12px; }
                    </style>
                </head>
                <body>
                    <script>
                        console.log = function(...args) {
                            document.body.innerHTML += args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') + '<br>';
                        };
                        try {
                            ${code}
                        } catch(err) {
                            document.body.innerHTML += '<span style="color:#ef4444;">Error: ' + err.message + '</span>';
                        }
                    <\/script>
                </body>
                </html>
            `);
            doc.close();
        }

        function copyMessageText(element) {
            const textToCopy = element.innerText || element.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const tooltip = element.parentElement.querySelector('.copy-tooltip');
                if (tooltip) {
                    tooltip.classList.add('show');
                    setTimeout(() => tooltip.classList.remove('show'), 2000);
                }
            });
        }

        function appendMessage(sender, text, type = 'text') {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender === 'user' ? 'user-wrapper' : 'capella-wrapper'}`;
            
            let contentHTML = type === 'image' ? text : (sender === 'capella' ? renderMessageContent(text) : text.replace(/\n/g, '<br>'));

            if (sender === 'user') {
                wrapper.innerHTML = `
                    <div class="message-header">
                        <img src="https://i.ibb.co.com/tVR2mBp/a98ff012-7af2-4721-86c9-7ce345972666.png" class="sender-icon">
                        <span class="sender-name">You</span>
                    </div>
                    <div class="message-box-outer">
                        <div class="copy-tooltip">Copied!</div>
                        <div class="message user-msg" onclick="copyMessageText(this)">${contentHTML}</div>
                    </div>`;
            } else {
                wrapper.innerHTML = `
                    <div class="message-header">
                        <img src="https://i.ibb.co.com/tVR2mBp/a98ff012-7af2-4721-86c9-7ce345972666.png" class="sender-icon">
                        <span class="sender-name">Capella</span>
                    </div>
                    <div class="message-box-outer">
                        <div class="copy-tooltip">Copied!</div>
                        <div class="message capella-msg" onclick="copyMessageText(this)">${contentHTML}</div>
                    </div>`;
            }

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendThinking(text = "Capella is thinking...") {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper capella-wrapper';
            wrapper.id = 'thinkingWrapper';
            wrapper.innerHTML = `
                <div class="message-header">
                    <img src="https://i.ibb.co.com/tVR2mBp/a98ff012-7af2-4721-86c9-7ce345972666.png" class="sender-icon">
                    <span class="sender-name">Capella</span>
                </div>
                <div class="message capella-msg">
                    <div class="thinking-indicator">
                        <div class="blue-dot-pulse"></div>
                        <span style="font-size:0.85rem; color:#94a3b8;">${text}</span>
                    </div>
                </div>`;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeThinking() {
            const el = document.getElementById('thinkingWrapper');
            if (el) el.remove();
        }

        async function handleSend() {
            if (isGenerating) {
                if (abortController) abortController.abort();
                isGenerating = false;
                sendBtn.innerText = 'Send';
                sendBtn.classList.remove('stop-mode');
                removeThinking();
                return;
            }

            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage('user', text);

            if (currentMode === 'video' || currentMode === 'audio') {
                appendMessage('capella', '⚠️ This feature is currently under active development.');
                return;
            }

            isGenerating = true;
            sendBtn.innerText = 'Stop';
            sendBtn.classList.add('stop-mode');
            abortController = new AbortController();

            // Image Mode জেনারেট শুধুমাত্র Image Generator ট্যাবেই হবে
            if (currentMode === 'image') {
                appendThinking("Capella is generating image...");
                try {
                    const res = await fetch('/api/generate-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: text }),
                        signal: abortController.signal
                    });
                    const data = await res.json();
                    removeThinking();
                    isGenerating = false;
                    sendBtn.innerText = 'Send';
                    sendBtn.classList.remove('stop-mode');

                    if (data.success) {
                        const imgHTML = `<img src="${data.imageUrl}" class="msg-image"><br><a href="${data.imageUrl}" download="capella.jpg" target="_blank" class="download-img-btn">⬇ Download Image</a>`;
                        appendMessage('capella', imgHTML, 'image');
                    } else {
                        appendMessage('capella', '⚠️ Image generation failed.');
                    }
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        removeThinking();
                        appendMessage('capella', '⚠️ Error generating image.');
                    }
                    isGenerating = false;
                    sendBtn.innerText = 'Send';
                    sendBtn.classList.remove('stop-mode');
                }
                return;
            }

            // Chat Mode
            chatHistory.push({ role: 'user', content: text });
            const selectedModel = modelSelector.value;
            const isDeepResearch = selectedModel === 'deep-research';
            const thinkingMsg = isDeepResearch ? "🔍 Capella is performing Deep Research & searching the web..." : "🔍 Capella is searching the web...";
            
            appendThinking(thinkingMsg);

            try {
                const selectedLang = langSelect.value;
                let langInstruction = selectedLang !== "auto" ? `Respond STRICTLY in ${selectedLang} language.` : "";

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: chatHistory,
                        modelType: selectedModel,
                        enableSearch: searchToggle.checked,
                        languageInstruction: langInstruction
                    }),
                    signal: abortController.signal
                });

                const data = await res.json();
                removeThinking();
                isGenerating = false;
                sendBtn.innerText = 'Send';
                sendBtn.classList.remove('stop-mode');

                if (res.ok) {
                    appendMessage('capella', data.reply);
                    chatHistory.push({ role: 'assistant', content: data.reply });
                } else {
                    appendMessage('capella', '⚠️ Error processing request.');
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    removeThinking();
                    appendMessage('capella', '⚠️ Connection error.');
                }
                isGenerating = false;
                sendBtn.innerText = 'Send';
                sendBtn.classList.remove('stop-mode');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // Initial Load Greeting
        resetChatUI();
    </script>
</body>
</html>
