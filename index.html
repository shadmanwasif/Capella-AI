<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capella AI - Intelligent Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0f12;
            color: #f0f3f8;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Light Theme Variations */
        body.light-theme {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-theme .header { background: rgba(255, 255, 255, 0.9); border-bottom: 1px solid #e2e8f0; }
        body.light-theme .sidebar { background-color: #ffffff; border-right: 1px solid #e2e8f0; }
        body.light-theme .sidebar-header { border-bottom: 1px solid #e2e8f0; }
        body.light-theme .capella-msg { background-color: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        body.light-theme .user-msg { background: linear-gradient(135deg, #4f46e5, #3730a3); color: #ffffff; border: none; }
        body.light-theme .input-container { background: rgba(255, 255, 255, 0.95); border-top: 1px solid #e2e8f0; }
        body.light-theme .input-box { background-color: #f1f5f9; border: 1px solid #cbd5e1; }
        body.light-theme .input-box textarea { color: #0f172a; }
        body.light-theme .icon-btn { color: #64748b; }
        body.light-theme .icon-btn:hover { background-color: #e2e8f0; }
        body.light-theme .code-block { background-color: #f8fafc; border: 1px solid #e2e8f0; }
        body.light-theme .code-header { background-color: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
        body.light-theme .code-content { color: #0f172a; }
        body.light-theme .sender-name { color: #64748b; }
        body.light-theme .settings-modal { background: #ffffff; color: #0f172a; }
        body.light-theme .setting-item { border-bottom: 1px solid #e2e8f0; }

        /* Splash Screen */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #07080a;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 16px; z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash-screen.hide { opacity: 0; visibility: hidden; }
        .splash-logo { width: 80px; height: 80px; border-radius: 20%; animation: pulse 2s infinite ease-in-out; object-fit: cover;}
        .splash-title { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.7)); }
        }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: rgba(18, 20, 26, 0.9);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10; flex-shrink: 0; transition: background 0.3s;
        }
        .header-left, .header-right { display: flex; align-items: center; gap: 10px; }
        .brand-box { display: flex; align-items: center; gap: 8px; }
        .app-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
        .app-title { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .icon-btn {
            background: none; border: none; color: #94a3b8; font-size: 1.2rem;
            cursor: pointer; padding: 8px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .icon-btn:hover { background-color: rgba(255, 255, 255, 0.08); color: #818cf8; }

        /* Settings Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .settings-modal {
            background: #12141a; padding: 20px; border-radius: 16px;
            width: 90%; max-width: 360px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px;
        }
        .settings-modal h3 { text-align: center; font-size: 1.2rem; color: #818cf8; margin-bottom: 5px; }
        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.92rem; font-weight: 500;
        }
        .setting-item:last-child { border-bottom: none; }
        .setting-select {
            background: #1e2029; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 10px; border-radius: 8px; outline: none; font-size: 0.85rem; cursor: pointer;
        }
        .close-settings {
            background: #4f46e5; color: white; border: none; padding: 10px; border-radius: 10px;
            font-weight: 600; margin-top: 10px; cursor: pointer; transition: background 0.2s;
        }
        .close-settings:hover { background: #6366f1; }
        
        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #6366f1; }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Sidebar */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 999; display: none; }
        .overlay.active { display: block; }
        
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background-color: #12141a; border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000; transition: left 0.3s ease; display: flex; flex-direction: column;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .sidebar-content { flex: 1; padding: 16px; }
        .new-chat-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); transition: transform 0.1s;
        }
        .new-chat-btn:active { transform: scale(0.98); }

        /* Chat Container */
        .chat-container {
            flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
        }
        .message-wrapper { display: flex; flex-direction: column; max-width: 88%; position: relative; }
        .user-wrapper { align-self: flex-end; }
        .capella-wrapper { align-self: flex-start; }
        
        .message-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; width: 100%; }
        .message-header-left { display: flex; align-items: center; gap: 6px; }
        .sender-icon { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #6366f1; }
        .sender-name { font-size: 0.78rem; color: #94a3b8; font-weight: 500; transition: color 0.3s; }
        
        .type-percentage { font-size: 0.7rem; color: #818cf8; font-weight: 600; background: rgba(99,102,241,0.1); padding: 2px 6px; border-radius: 10px; }

        .message {
            padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.92rem; word-wrap: break-word; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); transition: background 0.3s, color 0.3s; cursor: pointer; user-select: text;
        }
        .user-msg { background: linear-gradient(135deg, #312e81, #1e1b4b); color: #f1f5f9; border-bottom-right-radius: 4px; border: 1px solid rgba(99, 102, 241, 0.3); }
        .capella-msg { background-color: #181b22; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.08); }
        
        .msg-image { max-width: 100%; max-height: 280px; border-radius: 10px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.1); display: block; object-fit: cover;}

        /* Quick Action Copy Button */
        .msg-copy-bar {
            display: none; position: absolute; bottom: -28px; background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 3px 10px; border-radius: 12px;
            font-size: 0.72rem; color: #38bdf8; font-weight: 600; cursor: pointer; z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: opacity 0.2s;
        }
        .user-wrapper .msg-copy-bar { right: 0; }
        .capella-wrapper .msg-copy-bar { left: 0; }
        .msg-copy-bar.active { display: flex; align-items: center; gap: 4px; }

        /* Code Blocks & Writing Boxes */
        .code-block { background-color: #0d0e12; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; margin: 8px 0; overflow: hidden; transition: background 0.3s; }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background-color: #161820; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.72rem; color: #818cf8; font-weight: 600; transition: background 0.3s; }
        .code-copy-btn { background: rgba(255, 255, 255, 0.08); border: none; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
        .code-content { padding: 10px; font-family: 'Fira Code', monospace, sans-serif; white-space: pre-wrap; overflow-x: auto; font-size: 0.85rem; color: #e2e8f0; line-height: 1.6; transition: color 0.3s;}

        /* Image Generation Component */
        .gen-container {
            width: 250px; height: 250px; background: #12141a; border: 2px dashed rgba(255,255,255,0.1); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; margin-top: 10px;
        }
        .gen-loader-box { display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 1; }
        .gen-loader {
            width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #818cf8; border-radius: 50%; animation: spin 1s linear infinite;
        }
        .gen-pct { font-size: 0.8rem; color: #818cf8; font-weight: 600; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .gen-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s; position: absolute; top:0; left:0; z-index: 2; }
        .gen-img.loaded { opacity: 1; cursor: pointer; }
        
        .gen-actions {
            position: absolute; bottom: 8px; display: flex; gap: 8px; z-index: 3; opacity: 0; transition: opacity 0.2s; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 20px;
        }
        .gen-container:hover .gen-actions { opacity: 1; }
        .gen-btn { background: #4f46e5; border: none; color: white; padding: 4px 10px; font-size: 0.75rem; border-radius: 12px; cursor: pointer; }

        /* Fullscreen Image Viewer */
        .image-viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000;
            display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        .image-viewer.active { display: flex; }
        .viewer-img { max-width: 90%; max-height: 80%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .viewer-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 1.5rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

        /* Input Bar */
        .input-container {
            padding: 10px 12px; background: rgba(18, 20, 26, 0.95); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; transition: background 0.3s;
        }
        .preview-wrapper { display: none; position: relative; align-self: flex-start; }
        .preview-wrapper.active { display: block; }
        .img-preview { height: 55px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .remove-img-btn { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }
        
        .input-box { display: flex; align-items: center; gap: 8px; background-color: #161820; border-radius: 20px; padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.1); transition: background 0.3s; }
        .input-box textarea { flex: 1; background: none; border: none; color: #f1f5f9; resize: none; max-height: 120px; outline: none; font-size: 0.92rem; padding: 4px 0; transition: color 0.3s; }
        
        .send-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; padding: 8px 14px; border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 0.82rem; flex-shrink: 0; }
        .send-btn.stop-mode { background: #ef4444; }

        /* Thinking Indicator */
        .thinking-indicator { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
        .blue-dot-pulse { width: 8px; height: 8px; background-color: #818cf8; border-radius: 50%; animation: dotPulse 1.2s infinite ease-in-out; }
        @keyframes dotPulse { 0%, 100% { transform: scale(0.8); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 1; } }
    </style>
</head>

        // Settings Logic
        settingsBtn.addEventListener('click', () => settingsOverlay.classList.add('active'));
        closeSettingsBtn.addEventListener('click', () => {
            settingsOverlay.classList.remove('active');
            settings.lightMode = themeToggle.checked;
            settings.thinkingMode = modeToggle.checked;
            settings.sound = soundToggle.checked;
            settings.language = languageSelect.value;
            
            if (settings.lightMode) document.body.classList.add('light-theme');
            else document.body.classList.remove('light-theme');
        });

        menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('active'); });
        closeBtn.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); });

        newChatBtn.addEventListener('click', () => {
            chatHistory = [{ role: "system", content: SYSTEM_PROMPT }];
            chatContainer.innerHTML = `
                <div class="message-wrapper capella-wrapper">
                    <div class="message-header">
                        <div class="message-header-left">
                            <img src="${CAPELLA_PFP_URL}" onerror="this.src='https://api.iconify.design/lucide:bot.svg'" class="sender-icon">
                            <span class="sender-name">Capella</span>
                        </div>
                    </div>
                    <div class="message capella-msg" onclick="toggleCopyBar(this)">
                        <div class="msg-text">Hello! I am Capella AI. How can I assist you today?</div>
                    </div>
                    <div class="msg-copy-bar" onclick="copyMsgText(this)">📋 Copy Message</div>
                </div>
            `;
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImageData = event.target.result;
                    imgPreview.src = selectedImageData;
                    previewWrapper.classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        });
        document.getElementById('removeImgBtn').addEventListener('click', () => {
            selectedImageData = null; fileInput.value = ''; previewWrapper.classList.remove('active');
        });

        function isUserAtBottom() {
            return chatContainer.scrollHeight - chatContainer.scrollTop <= chatContainer.clientHeight + 50;
        }

        function toggleCopyBar(msgEl) {
            const wrapper = msgEl.closest('.message-wrapper');
            const copyBar = wrapper.querySelector('.msg-copy-bar');
            if (copyBar) {
                document.querySelectorAll('.msg-copy-bar').forEach(bar => {
                    if (bar !== copyBar) bar.classList.remove('active');
                });
                copyBar.classList.toggle('active');
            }
        }

        function copyMsgText(copyBarEl) {
            const wrapper = copyBarEl.closest('.message-wrapper');
            const msgText = wrapper.querySelector('.msg-text').innerText;
            navigator.clipboard.writeText(msgText).then(() => {
                copyBarEl.innerText = "✓ Copied!";
                setTimeout(() => {
                    copyBarEl.innerText = "📋 Copy Message";
                    copyBarEl.classList.remove('active');
                }, 1500);
            });
        }

        function playTick() {
            if (!settings.sound) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.value = 600;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.03);
        }

        let backgroundFastForward = false;
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isGenerating) {
                backgroundFastForward = true;
            }
        });

        // HuggingFace Standard Vision API Fallback
        async function fetchHuggingFaceImageResponse(promptText, base64Image) {
            try {
                const finalPrompt = promptText.trim() === "" ? "Describe this image in detail." : promptText;
                
                const response = await fetch("https://api-inference.huggingface.co/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${HF_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "meta-llama/Llama-3.2-11B-Vision-Instruct",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: finalPrompt },
                                    { type: "image_url", image_url: { url: base64Image } }
                                ]
                            }
                        ],
                        max_tokens: 500
                    }),
                    signal: abortController.signal
                });

                const data = await response.json();
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    return data.choices[0].message.content;
                } else {
                    return "Many people are using Capella right now. Please try again later.";
                }
            } catch (err) {
                return "Many people are using Capella right now. Please try again later.";
            }
        }

        // Fetch Logic (Updated)
        async function fetchResponse(promptText, base64Image) {
            abortController = new AbortController();
            
            let apiPrompt = promptText;
            if (settings.language !== 'English') {
                apiPrompt += `\n[Respond in ${settings.language} language. Directly answer without restating prompt.]`;
            }
            if (settings.thinkingMode && !base64Image) {
                apiPrompt += "\n(Think step-by-step and provide detailed reasoning.)";
            }
            
            let thinkPct = 0;
            const thinkLabel = document.getElementById('thinkPctText');
            let thinkInterval = setInterval(() => {
                if (thinkPct < 98) {
                    thinkPct += Math.floor(Math.random() * 8) + 1;
                    if(thinkPct > 98) thinkPct = 98;
                    if(thinkLabel) thinkLabel.innerText = thinkPct + "%";
                }
            }, 100);

            try {
                if (base64Image) {
                    // Image Processing via Gemini
                    try {
                        const mimeType = base64Image.substring(base64Image.indexOf(":") + 1, base64Image.indexOf(";"));
                        const base64Data = base64Image.split(',')[1];
                        const finalPrompt = promptText.trim() === "" ? "Describe this image in detail." : apiPrompt;

                        const contents = [{ 
                            parts: [
                                { text: SYSTEM_PROMPT + "\n\nUser Question: " + finalPrompt }, 
                                { inline_data: { mime_type: mimeType, data: base64Data } }
                            ] 
                        }];

                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents }),
                            signal: abortController.signal
                        });

                        const data = await res.json();
                        if (data.error || !data.candidates?.[0]?.content?.parts?.[0]?.text) {
                            throw new Error("Gemini Image API Error");
                        }

                        clearInterval(thinkInterval);
                        if(thinkLabel) thinkLabel.innerText = "100%";
                        return data.candidates[0].content.parts[0].text;

                    } catch (geminiError) {
                        // Fallback to HuggingFace
                        const hfReply = await fetchHuggingFaceImageResponse(promptText, base64Image);
                        clearInterval(thinkInterval);
                        if(thinkLabel) thinkLabel.innerText = "100%";
                        return hfReply;
                    }

                } else {
                    // Text & Code Requests handled smoothly via Groq Llama 3.3 70B
                    const apiMsgs = [...chatHistory, { role: "user", content: apiPrompt }];
                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: apiMsgs, temperature: 0.7 }),
                        signal: abortController.signal
                    });
                    
                    clearInterval(thinkInterval);
                    if(thinkLabel) thinkLabel.innerText = "100%";

                    const data = await res.json();
                    if(data.error) throw new Error();
                    const reply = data.choices[0].message.content;
                    
                    chatHistory.push({ role: "user", content: promptText });
                    chatHistory.push({ role: "assistant", content: reply });
                    return reply;
                }
            } catch(e) {
                clearInterval(thinkInterval);
                if (e.name === 'AbortError') return null;
                return "Many people are using Capella right now. Please try again later.";
            }
        }

        function renderMessageContent(text) {
            let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/```(\w*)\n([\s\S]*?)(?:```|$)/g, (match, lang, code) => {
                const headerText = lang ? lang.toUpperCase() : 'TEXT';
                return `<div class="code-block"><div class="code-header"><span>\( {headerText}</span><button class="code-copy-btn" onclick="copyCode(this)">Copy</button></div><div class="code-content"> \){code}</div></div>`;
            });
            return html;
        }

        window.copyCode = function(btn) {
            const code = btn.closest('.code-block').querySelector('.code-content').innerText;
            navigator.clipboard.writeText(code).then(() => { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); });
        }

        function createPollinationsImageUI(container, promptText) {
            const encodedPrompt = encodeURIComponent(promptText);
            const imgUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true`;
            
            const genUI = document.createElement('div');
            genUI.className = 'gen-container';
            genUI.innerHTML = `
                <div class="gen-loader-box">
                    <div class="gen-loader"></div>
                    <div class="gen-pct">0%</div>
                </div>
                <img src="${imgUrl}" class="gen-img" alt="Generated Image" />
                <div class="gen-actions">
                    <button class="gen-btn view-btn">Expand</button>
                    <a href="${imgUrl}" download="Generated_Image.jpg" class="gen-btn download-btn" target="_blank" style="text-decoration:none">Save</a>
                </div>
            `;
            container.appendChild(genUI);

            const pctLabel = genUI.querySelector('.gen-pct');
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 95) {
                    progress += Math.floor(Math.random() * 6) + 2;
                    if (progress > 95) progress = 95;
                    pctLabel.textContent = progress + "%";
                }
            }, 180);

            const imgEl = genUI.querySelector('.gen-img');
            imgEl.onload = () => {
                clearInterval(progressInterval);
                pctLabel.textContent = "100%";
                imgEl.classList.add('loaded');
                genUI.querySelector('.gen-loader-box').style.display = 'none';
            };

            genUI.querySelector('.view-btn').addEventListener('click', () => openImageViewer(imgUrl));
            imgEl.addEventListener('click', () => { if(imgEl.classList.contains('loaded')) openImageViewer(imgUrl); });
        }

        const imageViewer = document.getElementById('imageViewer');
        const viewerImg = document.getElementById('viewerImg');
        const viewerDownload = document.getElementById('viewerDownload');
        
        function openImageViewer(url) {
            viewerImg.src = url;
            viewerDownload.href = url;
            imageViewer.classList.add('active');
        }
        document.getElementById('viewerClose').addEventListener('click', () => imageViewer.classList.remove('active'));

        function typeWriterText(element, percentLabel, fullText, speed = 12, onComplete) {
            shouldStopTyping = false;
            backgroundFastForward = false;

            let imagePrompt = null;
            let isOwnerQuery = fullText.includes('[OWNER_PIC]');

            if (isOwnerQuery) {
                fullText = fullText.replace(/\[OWNER_PIC\]/g, '').trim();
            }

            const imgMatch = fullText.match(/\[IMAGE:(.*?)\]/i);
            if (imgMatch) {
                imagePrompt = imgMatch[1].trim();
                fullText = fullText.replace(imgMatch[0], '').trim();
            }

            function finishTypingInstantly() {
                element.innerHTML = renderMessageContent(fullText);
                percentLabel.textContent = "100%";
                setTimeout(() => percentLabel.style.display = 'none', 1000); 
                
                if (isOwnerQuery) {
                    const ownerUI = document.createElement('div');
                    ownerUI.className = 'gen-container';
                    ownerUI.style.marginTop = '10px';
                    ownerUI.innerHTML = `
                        <img src="${OWNER_PIC_URL}" class="gen-img loaded" alt="Owner Image" style="opacity: 1; position: absolute; top:0; left:0;" onerror="this.onerror=null; this.src='https://api.iconify.design/lucide:user.svg';" />
                        <div class="gen-actions">
                            <button class="gen-btn view-btn">Expand</button>
                            <a href="${OWNER_PIC_URL}" download="Owner_Image.jpg" class="gen-btn download-btn" target="_blank" style="text-decoration:none">Save</a>
                        </div>
                    `;
                    ownerUI.querySelector('.view-btn').addEventListener('click', () => openImageViewer(OWNER_PIC_URL));
                    ownerUI.querySelector('.gen-img').addEventListener('click', () => openImageViewer(OWNER_PIC_URL));
                    element.parentElement.appendChild(ownerUI);
                }

                if (imagePrompt) {
                    createPollinationsImageUI(element.parentElement, imagePrompt);
                }
                if(isUserAtBottom()) chatContainer.scrollTop = chatContainer.scrollHeight;
                if (onComplete) onComplete();
            }

            const hasCodeBlock = fullText.includes('```');
            if (hasCodeBlock) {
                finishTypingInstantly();
                return;
            }

            let index = 0;
            element.innerHTML = '';

            function typeNext() {
                if (shouldStopTyping || backgroundFastForward) {
                    finishTypingInstantly();
                    return;
                }

                if (index < fullText.length) {
                    element.innerHTML = renderMessageContent(fullText.slice(0, index + 1));
                    if(index % 3 === 0) playTick();
                    
                    const p = Math.floor(((index + 1) / fullText.length) * 100);
                    percentLabel.textContent = p + "%";

                    if (isUserAtBottom()) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }

                    index++;
                    typeWriterTimeout = setTimeout(typeNext, speed);
                } else {
                    finishTypingInstantly();
                }
            }
            typeNext();
        }

        async function sendMessage() {
            if (isGenerating) {
                shouldStopTyping = true;
                if(abortController) abortController.abort();
                isGenerating = false;
                sendBtn.textContent = 'Send';
                sendBtn.classList.remove('stop-mode');
                const tb = document.getElementById('thinkingBubble');
                if(tb) tb.remove();
                return;
            }
            
            if(!audioCtx && settings.sound) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const text = userInput.value.trim();
            if (!text && !selectedImageData) return;

            isGenerating = true;
            sendBtn.textContent = 'Stop';
            sendBtn.classList.add('stop-mode');

            const uText = text;
            const uImg = selectedImageData;

            const uWrapper = document.createElement('div');
            uWrapper.className = 'message-wrapper user-wrapper';
            let uHtml = `
                <div class="message-header"><div style="flex:1"></div><span class="sender-name">You</span></div>
                <div class="message user-msg" onclick="toggleCopyBar(this)">`;
            if (uText) uHtml += `<div class="msg-text">${uText.replace(/</g, "&lt;")}</div>`;
            if (uImg) uHtml += `<img src="${uImg}" class="msg-image">`;
            uHtml += `</div><div class="msg-copy-bar" onclick="copyMsgText(this)">📋 Copy Message</div>`;
            uWrapper.innerHTML = uHtml;
            chatContainer.appendChild(uWrapper);

            userInput.value = ''; userInput.style.height = 'auto';
            document.getElementById('removeImgBtn').click(); 
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const tb = document.createElement('div');
            tb.className = 'message-wrapper capella-wrapper';
            tb.id = 'thinkingBubble';
            tb.innerHTML = `<div class="message-header"><div class="message-header-left"><img src="${CAPELLA_PFP_URL}" onerror="this.src='https://api.iconify.design/lucide:bot.svg'" class="sender-icon"><span class="sender-name">Capella</span></div></div>
            <div class="message capella-msg"><div class="thinking-indicator"><div class="blue-dot-pulse"></div><span style="font-size:0.8rem;color:#94a3b8">Thinking... <span id="thinkPctText">0%</span></span></div></div>`;
            chatContainer.appendChild(tb);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiReply = await fetchResponse(uText, uImg);
            const currentTb = document.getElementById('thinkingBubble');
            if (currentTb) currentTb.remove();

            if (aiReply === null) return; 

            const aiWrapper = document.createElement('div');
            aiWrapper.className = 'message-wrapper capella-wrapper';
            aiWrapper.innerHTML = `
                <div class="message-header">
                    <div class="message-header-left">
                        <img src="${CAPELLA_PFP_URL}" onerror="this.src='https://api.iconify.design/lucide:bot.svg'" class="sender-icon">
                        <span class="sender-name">Capella</span>
                    </div>
                    <span class="type-percentage">0%</span>
                </div>
                <div class="message capella-msg" onclick="toggleCopyBar(this)">
                    <div class="msg-text"></div>
                </div>
                <div class="msg-copy-bar" onclick="copyMsgText(this)">📋 Copy Message</div>
            `;
            chatContainer.appendChild(aiWrapper);

            const msgTextDiv = aiWrapper.querySelector('.msg-text');
            const pctLabel = aiWrapper.querySelector('.type-percentage');

            typeWriterText(msgTextDiv, pctLabel, aiReply, 12, () => {
                isGenerating = false;
                sendBtn.textContent = 'Send';
                sendBtn.classList.remove('stop-mode');
            });
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
